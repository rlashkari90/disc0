    font-size: 34px;
    font-weight: 600;

  .disc-sub {

    margin-bottom: 28px;
  }

    background: var(--card);
    border: 1px solid var(--line);

    background: var(--line);
    border-radius: 4px;
    margin-bottom: 24px;

  .disc-progress-label {
    font-size: 12px;
    color: var(--muted);

    padding: 0 4px 6px;

    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;

    text-align: center;

    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);

  .disc-choice-btn.least-selected {
    background: #ded9ce;
    border-color: #b9b2a2;
    color: var(--ink);

    font-size: 12px;
    color: var(--muted);

  @media (max-width: 480px) {
    .disc-card { padding: 20px; }

    .disc-phrase-text { font-size: 13px; }
    .disc-col-headers, .disc-phrase-row { grid-template-columns: 1fr 50px 50px; }

    for (let i = a.length - 1; i > 0; i--) {

      `).join('')}

      <div class="disc-hint">Pick one "Most" and one "Least" from the four words above.</div>

      <div class="disc-nav">
        <button class="disc-btn disc-btn-ghost" id="disc-back" ${current === 0 ? 'disabled' : ''}>Back</button>
        <button class="disc-btn disc-btn-primary" id="disc-next" ${(a.most === null || a.least === null) ? 'disabled' : ''}>
          ${current === ROUNDS.length - 1 ? 'See results' : 'Next'}
        </button>
      </div>
    `;

    root.querySelectorAll('.disc-choice-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const kind = btn.getAttribute('data-kind');
        const idx = parseInt(btn.getAttribute('data-idx'), 10);
        answers[current][kind] = idx;
        renderQuestion();
      });
    });
    document.getElementById('disc-back').addEventListener('click', () => {
      if (current > 0) { current--; renderQuestion(); }
    });
    document.getElementById('disc-next').addEventListener('click', () => {
      if (a.most === null || a.least === null) return;
      if (current < ROUNDS.length - 1) { current++; renderQuestion(); }
      else { finishQuizAndShowResults(); }
    });
  }

  function rankOf(pcts) {
    const ranked = Object.keys(pcts).sort((a, b) => pcts[b] - pcts[a]);
    const gapClose = (pcts[ranked[0]] - pcts[ranked[1]]) <= 6;
    return { pcts, ranked, gapClose };
  }

  function computeScores() {
    const mostCount = { D: 0, I: 0, S: 0, C: 0 };
    const leastCount = { D: 0, I: 0, S: 0, C: 0 };
    ROUNDS.forEach((round, i) => {
      const a = answers[i];
      mostCount[round[a.most].t]++;
      leastCount[round[a.least].t]++;
    });

    const total = ROUNDS.length; // 24
    const adaptivePcts = {};
    Object.keys(mostCount).forEach(k => adaptivePcts[k] = Math.round(mostCount[k] / total * 100));

    // Natural/core style = net of most-minus-least, rescaled to a 0-100 range.
    const naturalPcts = {};
    Object.keys(mostCount).forEach(k => {
      const net = mostCount[k] - leastCount[k]; // ranges roughly -24..24
      naturalPcts[k] = Math.round(((net + total) / (total * 2)) * 100);
    });

    return { adaptive: rankOf(adaptivePcts), natural: rankOf(naturalPcts), mostCount, leastCount };
  }

  // Encode/decode a compact results payload into a URL so a results link can
  // reopen straight to someone's results without re-taking the assessment.
  function encodeResultsPayload(natPcts, adaPcts, name) {
    const payload = JSON.stringify({ n: natPcts, a: adaPcts, nm: name || '' });
    return btoa(unescape(encodeURIComponent(payload)));
  }
  function decodeResultsPayload(str) {
    try {
      const json = decodeURIComponent(escape(atob(str)));
      const obj = JSON.parse(json);
      if (!obj || !obj.n || !obj.a) return null;
      return obj;
    } catch (e) {
      return null;
    }
  }
  function buildResultsLink(natPcts, adaPcts, name) {
    const encoded = encodeResultsPayload(natPcts, adaPcts, name);
    const base = window.location.origin + window.location.pathname;
    return base + '?r=' + encodeURIComponent(encoded);
  }

  function summaryLine(sc) {
    return ['D', 'I', 'S', 'C'].map(k => k + ' ' + sc.pcts[k] + '%').join(' / ') +
      ' — ' + TRAIT_META[sc.ranked[0]].name + '-leaning';
  }

  function sendResultEmails(nat, ada, link) {
    if (!window.emailjs) return;
    const natSummary = summaryLine(nat);
    const adaSummary = summaryLine(ada);

    // Copy to the person who took it
    if (reportEmail) {
      emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
        to_email: reportEmail,
        to_name: reportName || 'there',
        natural_summary: natSummary,
        adaptive_summary: adaSummary,
        results_link: link,
      }).catch(err => console.error('EmailJS (respondent) error:', err));
    }

    // Copy to the agent
    const takerLabel = reportName ? reportName : (reportEmail || 'Someone');
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email: AGENT_EMAIL,
      to_name: 'Reza',
      natural_summary: takerLabel + ' — Natural: ' + natSummary,
      adaptive_summary: takerLabel + ' — Adaptive: ' + adaSummary,
      results_link: link,
    }).catch(err => console.error('EmailJS (agent) error:', err));
  }


  function barsHtml(pcts) {
    return `
      <div class="disc-bars">
        ${['D','I','S','C'].map(k => `
          <div class="disc-bar-row">
            <div class="disc-bar-label">${TRAIT_META[k].name}</div>
            <div class="disc-bar-track"><div class="disc-bar-fill" data-w="${pcts[k]}" style="background:${TRAIT_META[k].hex}"></div></div>
            <div class="disc-bar-pct">${pcts[k]}%</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function finishQuizAndShowResults() {
    const scores = computeScores();
    const nat = scores.natural, ada = scores.adaptive;
    const link = buildResultsLink(nat.pcts, ada.pcts, reportName);
    sendResultEmails(nat, ada, link);
    displayResults(nat, ada, { link, justFinished: true });
  }

  function displayResults(nat, ada, opts) {
    opts = opts || {};

    const gaps = ['D','I','S','C'].map(k => ({ k, diff: ada.pcts[k] - nat.pcts[k] }));
    const biggestUp = gaps.slice().sort((a, b) => b.diff - a.diff)[0];
    const biggestDown = gaps.slice().sort((a, b) => a.diff - b.diff)[0];
    const overallShift = gaps.reduce((s, g) => s + Math.abs(g.diff), 0) / 4;

    function primaryBlock(sc) {
      const top = sc.ranked[0], second = sc.ranked[1];
      return `
        <div class="disc-profile-tag" style="background:${TRAIT_META[top].hex}">
          ${sc.gapClose ? TRAIT_META[top].name + ' / ' + TRAIT_META[second].name : TRAIT_META[top].name}
        </div>
        <div class="disc-result-desc">
          <strong>${TRAIT_META[top].name}.</strong> ${TRAIT_META[top].blurb}
          ${sc.gapClose ? ` You also scored close behind in <strong>${TRAIT_META[second].name}</strong> — ${TRAIT_META[second].blurb.toLowerCase()}` : ''}
        </div>
        ${barsHtml(sc.pcts)}
      `;
    }

    root.innerHTML = `
      <div class="disc-eyebrow" style="margin-bottom:2px;">Your results</div>
      ${opts.justFinished ? `<div class="disc-gap-box" style="margin-top:0; margin-bottom:14px;">A copy of your results has been emailed to you${reportEmail ? ' at ' + reportEmail : ''}.</div>` : ''}

      <div class="disc-panel-tabs">
        <div class="disc-panel-tab active" data-panel="nat">Natural</div>
        <div class="disc-panel-tab" data-panel="ada">Adaptive (at work)</div>
      </div>

      <div id="disc-panel-nat">${primaryBlock(nat)}</div>
      <div id="disc-panel-ada" style="display:none;">${primaryBlock(ada)}</div>

      <div class="disc-gap-box">
        <b>Natural vs. adaptive gap</b>
        <div class="disc-gap-row">On average, your scores shift about <strong>${Math.round(overallShift)} points</strong> between your baseline tendency and how you present yourself at work.</div>
        <div class="disc-gap-row">You dial <strong>up</strong> ${TRAIT_META[biggestUp.k].name} the most at work (${biggestUp.diff >= 0 ? '+' : ''}${biggestUp.diff} pts).</div>
        <div class="disc-gap-row">You dial <strong>down</strong> ${TRAIT_META[biggestDown.k].name} the most at work (${biggestDown.diff >= 0 ? '+' : ''}${biggestDown.diff} pts).</div>
        <div class="disc-gap-row" style="margin-top:6px; color:var(--muted);">${overallShift >= 10
          ? "That's a fairly large adaptation — effective, but worth watching for fatigue if it's sustained all day, every day."
          : "That's a relatively small adaptation — your workplace behavior is close to your baseline, which is usually easier to sustain."}</div>
      </div>

      <div class="disc-restart" style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button class="disc-btn disc-btn-primary" id="disc-download">Download PDF report</button>
        <button class="disc-btn disc-btn-ghost" id="disc-restart">Retake assessment</button>
      </div>
    `;

    function animateBars() {
      root.querySelectorAll('.disc-bar-fill').forEach(el => {
        el.style.width = el.getAttribute('data-w') + '%';
      });
    }
    requestAnimationFrame(animateBars);

    root.querySelectorAll('.disc-panel-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        root.querySelectorAll('.disc-panel-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const which = tab.getAttribute('data-panel');
        document.getElementById('disc-panel-nat').style.display = which === 'nat' ? '' : 'none';
        document.getElementById('disc-panel-ada').style.display = which === 'ada' ? '' : 'none';
        requestAnimationFrame(animateBars);
      });
    });

    document.getElementById('disc-restart').addEventListener('click', () => {
      current = 0;
      answers.forEach(a => { a.most = null; a.least = null; });
      window.history.replaceState({}, '', window.location.pathname);
      renderIntro();
    });

    document.getElementById('disc-download').addEventListener('click', () => {
      buildPdfReport(nat, ada, gaps, overallShift);
    });
  }

  function buildPdfReport(nat, ada, gaps, overallShift) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'letter' });
    const pageW = doc.internal.pageSize.getWidth();
    const margin = 56;
    const usableW = pageW - margin * 2;
    let y = 64;

    function heading(text, size) {
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(size);
      doc.setTextColor('#1c1d2b');
      doc.text(text, margin, y);
      y += size * 0.9;
    }
    function bodyText(text, opts) {
      opts = opts || {};
      doc.setFont('helvetica', opts.bold ? 'bold' : 'normal');
      doc.setFontSize(opts.size || 11);
      doc.setTextColor(opts.color || '#33323d');
      const lines = doc.splitTextToSize(text, usableW - (opts.indent || 0));
      lines.forEach(line => {
        checkPageBreak(16);
        doc.text(line, margin + (opts.indent || 0), y);
        y += (opts.size || 11) * 1.35;
      });
    }
    function bullet(text) {
      checkPageBreak(16);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10.5);
      doc.setTextColor('#33323d');
      const lines = doc.splitTextToSize(text, usableW - 16);
      doc.text('\u2022', margin, y);
      lines.forEach((line, i) => {
        if (i > 0) checkPageBreak(15);
        doc.text(line, margin + 14, y);
        y += 15;
      });
      y += 4;
    }
    function spacer(h) { y += h; }
    function checkPageBreak(needed) {
      if (y + needed > 736) { doc.addPage(); y = 64; }
    }
    function divider() {
      doc.setDrawColor('#e4e1d8');
      doc.line(margin, y, pageW - margin, y);
      y += 18;
    }
    function sectionLabel(text) {
      checkPageBreak(26);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9);
      doc.setTextColor('#8a8896');
      doc.text(text.toUpperCase(), margin, y);
      y += 14;
    }
    function hexToRgb(hex) {
      hex = hex.replace('#', '');
      return [parseInt(hex.substr(0,2),16), parseInt(hex.substr(2,2),16), parseInt(hex.substr(4,2),16)];
    }
    function blendRgb(hexA, hexB) {
      const a = hexToRgb(hexA), b = hexToRgb(hexB);
      return [Math.round((a[0]+b[0])/2), Math.round((a[1]+b[1])/2), Math.round((a[2]+b[2])/2)];
    }
    function withOpacity(fn, opacity) {
      try {
        doc.saveGraphicsState();
        doc.setGState(new doc.GState({ opacity }));
        fn();
        doc.restoreGraphicsState();
      } catch (e) {
        fn();
      }
    }

    // Full-page bar graph: all four traits, Natural vs Adaptive side by side.
    function diamondIcon(cx, cy, r, hex, letter) {
      const pts = [[cx, cy - r], [cx + r, cy], [cx, cy + r], [cx - r, cy]];
      const segs = [];
      for (let i = 1; i < pts.length; i++) segs.push([pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]]);
      segs.push([pts[0][0]-pts[3][0], pts[0][1]-pts[3][1]]);
      doc.setFillColor(hex);
      doc.lines(segs, pts[0][0], pts[0][1], [1, 1], 'F', true);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.setTextColor('#ffffff');
      doc.text(letter, cx, cy + 4, { align: 'center' });
    }

    // Executive Summary page: vertical column chart (Natural vs Adaptive per
    // trait), diamond icons with the two scores, and a two-column explanation
    // of what "Natural" and "Adaptive" mean — all on one page.
    function executiveSummaryPage(nat, ada) {
      heading('Natural and Adaptive Styles Comparison', 14);
      spacer(12);

      const chartH = 190;
      const axisX = margin + 26;
      const chartW = usableW - 26;
      const y0 = y;
      const baseline = y0 + chartH;

      doc.setDrawColor('#e9e6dc');
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor('#9a988f');
      for (let v = 0; v <= 100; v += 10) {
        const gy = baseline - (v / 100) * chartH;
        doc.line(axisX, gy, axisX + chartW, gy);
        doc.text(String(v), axisX - 16, gy + 2);
      }

      const groupW = chartW / 4;
      const barW = 30;
      ['D','I','S','C'].forEach((k, i) => {
        const gx = axisX + groupW * i;
        const center = gx + groupW / 2;
        const natX = center - barW - 3;
        const adaX = center + 3;
        const natH = (nat.pcts[k] / 100) * chartH;
        const adaH = (ada.pcts[k] / 100) * chartH;

        doc.setFillColor(TRAIT_META[k].hex);
        doc.rect(natX, baseline - natH, barW, natH, 'F');
        doc.setFillColor('#9a988f');
        doc.rect(adaX, baseline - adaH, barW, adaH, 'F');

        diamondIcon(center, baseline + 30, 17, TRAIT_META[k].hex, k);

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10.5);
        doc.setTextColor('#1c1d2b');
        doc.text(nat.pcts[k] + ' / ' + ada.pcts[k], center, baseline + 58, { align: 'center' });
      });

      y = baseline + 78;
      doc.setFillColor(TRAIT_META.D.hex);
      doc.rect(margin, y, 10, 10, 'F');
      doc.setFontSize(9);
      doc.setTextColor('#6b6a75');
      doc.text('Colored bar = Natural', margin + 16, y + 8);
      doc.setFillColor('#9a988f');
      doc.rect(margin + 150, y, 10, 10, 'F');
      doc.text('Gray bar = Adaptive', margin + 166, y + 8);
      y += 26;
      divider();

      const gutter = 20;
      const colW = (usableW - gutter) / 2;
      const leftX = margin;
      const rightX = margin + colW + gutter;
      const yTop = y;

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11.5);
      doc.setTextColor('#1c1d2b');
      doc.text('Natural Style:', leftX, yTop);
      doc.text('Adaptive Style:', rightX, yTop);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      doc.setTextColor('#33323d');
      const natDesc = 'How you behave when you\'re operating on instinct \u2014 your baseline under low stress, and the mode you naturally return to. Leaning into this style tends to feel comfortable and low-effort.';
      const adaDesc = 'How you behave when you\'re consciously aware of the situation, or adjusting for what a role expects. Staying in this mode for long stretches, if it differs a lot from your natural style, can be tiring to sustain.';

      const leftLines = doc.splitTextToSize(natDesc, colW);
      const rightLines = doc.splitTextToSize(adaDesc, colW);
      let ly = yTop + 16, ry = yTop + 16;
      leftLines.forEach(line => { doc.text(line, leftX, ly); ly += 13; });
      rightLines.forEach(line => { doc.text(line, rightX, ry); ry += 13; });
      y = Math.max(ly, ry) + 6;
    }

    // Full-page quadrant map: plots BOTH Natural and Adaptive shapes on a
    // Task/People x Active/Reserved grid, with colored corner regions and
    // numbered scale ticks — the classic DISC "universal behavior model"
    // view, redrawn with original styling and colors.
    function quadrantChartFullPage(natPcts, adaPcts) {
      doc.addPage();
      y = 64;
      sectionLabel('Behavioral Style Map');
      heading('Where You Fall: Task vs. People, Active vs. Reserved', 16);
      spacer(8);
      bodyText('This map plots all four traits at once. The four corners are D, I, S, and C; the farther a point sits from the center, the more strongly that trait shows up. Your Natural style (solid, filled) and Adaptive style (dashed) are both plotted so you can see how they compare.', { size: 10 });
      spacer(16);

      const size = 320;
      const x0 = margin + (usableW - size) / 2;
      const y0 = y;
      const cx = x0 + size / 2;
      const cy = y0 + size / 2;
      const corners = { D: [x0, y0], I: [x0 + size, y0], S: [x0 + size, y0 + size], C: [x0, y0 + size] };
      const center = [cx, cy];

      // Soft colored corner regions (approximate gradient via blended triangles)
      withOpacity(() => {
        doc.setFillColor(...blendRgb(TRAIT_META.D.hex, TRAIT_META.I.hex));
        doc.triangle(corners.D[0], corners.D[1], corners.I[0], corners.I[1], center[0], center[1], 'F');
      }, 0.25);
      withOpacity(() => {
        doc.setFillColor(...blendRgb(TRAIT_META.I.hex, TRAIT_META.S.hex));
        doc.triangle(corners.I[0], corners.I[1], corners.S[0], corners.S[1], center[0], center[1], 'F');
      }, 0.25);
      withOpacity(() => {
        doc.setFillColor(...blendRgb(TRAIT_META.S.hex, TRAIT_META.C.hex));
        doc.triangle(corners.S[0], corners.S[1], corners.C[0], corners.C[1], center[0], center[1], 'F');
      }, 0.25);
      withOpacity(() => {
        doc.setFillColor(...blendRgb(TRAIT_META.C.hex, TRAIT_META.D.hex));
        doc.triangle(corners.C[0], corners.C[1], corners.D[0], corners.D[1], center[0], center[1], 'F');
      }, 0.25);

      doc.setDrawColor('#8f8c80');
      doc.setLineWidth(1.3);
      doc.rect(x0, y0, size, size);
      doc.setDrawColor('#c9c6ba');
      doc.setLineWidth(0.7);
      doc.line(x0, y0, x0 + size, y0 + size);
      doc.line(x0 + size, y0, x0, y0 + size);

      // Numbered scale ticks along each diagonal (10-90), matching where points plot
      ['D','I','S','C'].forEach(k => {
        const [ccx, ccy] = corners[k];
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(6.5);
        doc.setTextColor('#9a988f');
        for (let v = 10; v <= 90; v += 10) {
          const t = v / 100;
          const tx = cx + (ccx - cx) * t;
          const ty = cy + (ccy - cy) * t;
          doc.text(String(v), tx, ty, { align: 'center' });
        }
      });

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9);
      doc.setTextColor('#6b6a75');
      doc.text('ACTIVE', cx, y0 - 10, { align: 'center' });
      doc.text('RESERVED', cx, y0 + size + 16, { align: 'center' });
      doc.text('TASK', x0 - 8, cy, { align: 'right' });
      doc.text('PEOPLE', x0 + size + 8, cy);

      ['D','I','S','C'].forEach(k => {
        const [ccx, ccy] = corners[k];
        doc.setFillColor(TRAIT_META[k].hex);
        doc.circle(ccx, ccy, 12, 'F');
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.setTextColor('#ffffff');
        doc.text(k, ccx, ccy + 4, { align: 'center' });
      });

      function shapeFor(pcts) {
        return ['D','I','S','C'].map(k => {
          const [ccx, ccy] = corners[k];
          const t = pcts[k] / 100;
          return [cx + (ccx - cx) * t, cy + (ccy - cy) * t];
        });
      }
      function segsFor(points) {
        const segs = [];
        for (let i = 1; i < points.length; i++) segs.push([points[i][0]-points[i-1][0], points[i][1]-points[i-1][1]]);
        segs.push([points[0][0]-points[points.length-1][0], points[0][1]-points[points.length-1][1]]);
        return segs;
      }

      const natPoints = shapeFor(natPcts);
      const adaPoints = shapeFor(adaPcts);

      // Natural: filled solid shape
      withOpacity(() => {
        doc.setFillColor(43, 111, 119);
        doc.lines(segsFor(natPoints), natPoints[0][0], natPoints[0][1], [1,1], 'F', true);
      }, 0.30);
      doc.setDrawColor(43, 111, 119);
      doc.setLineWidth(1.8);
      doc.lines(segsFor(natPoints), natPoints[0][0], natPoints[0][1], [1,1], 'S', true);

      // Adaptive: dashed outline only
      doc.setDrawColor(120, 90, 40);
      doc.setLineWidth(1.6);
      try { doc.setLineDashPattern([4, 3], 0); } catch (e) {}
      doc.lines(segsFor(adaPoints), adaPoints[0][0], adaPoints[0][1], [1,1], 'S', true);
      try { doc.setLineDashPattern([], 0); } catch (e) {}

      // Data point markers + numbers
      ['D','I','S','C'].forEach((k, i) => {
        const np = natPoints[i], ap = adaPoints[i];
        doc.setFillColor(TRAIT_META[k].hex);
        doc.circle(np[0], np[1], 8, 'F');
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(8);
        doc.setTextColor('#ffffff');
        doc.text(String(natPcts[k]), np[0], np[1] + 2.5, { align: 'center' });

        doc.setDrawColor(120, 90, 40);
        doc.setFillColor(255, 255, 255);
        doc.circle(ap[0], ap[1], 8, 'FD');
        doc.setTextColor(120, 90, 40);
        doc.text(String(adaPcts[k]), ap[0], ap[1] + 2.5, { align: 'center' });
      });

      y = y0 + size + 34;
      doc.setFillColor(43, 111, 119);
      doc.circle(margin + 6, y - 3, 5, 'F');
      doc.setFontSize(9);
      doc.setTextColor('#6b6a75');
      doc.text('Natural (filled, solid line)', margin + 16, y);
      doc.setDrawColor(120, 90, 40);
      doc.setFillColor(255, 255, 255);
      doc.circle(margin + 190, y - 3, 5, 'FD');
      doc.text('Adaptive (dashed line)', margin + 200, y);
      y += 16;
    }

    // Low <-> High spectrum gauge for a single trait score.
    function spectrumGauge(k, pct) {
      checkPageBreak(30);
      const gaugeW = usableW;
      const gy = y;
      doc.setFillColor('#e4e1d8');
      doc.roundedRect(margin, gy, gaugeW, 6, 3, 3, 'F');
      const markerX = margin + gaugeW * (pct / 100);
      doc.setFillColor(TRAIT_META[k].hex);
      doc.circle(markerX, gy + 3, 5, 'F');
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor('#6b6a75');
      doc.text('Low: ' + LOWHIGH[k].low, margin, gy + 16);
      doc.text('High: ' + LOWHIGH[k].high, margin + gaugeW, gy + 16, { align: 'right' });
      y = gy + 26;
    }

    function traitChart(k, natPct, adaPct) {
      checkPageBreak(108);
      const chartH = 100;
      const chartTop = y;
      const axisX = margin + 26;
      const chartW = 140;
      const baseline = chartTop + chartH;

      doc.setDrawColor('#e4e1d8');
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(7);
      doc.setTextColor('#9a988f');
      [0, 25, 50, 75, 100].forEach(v => {
        const gy = baseline - (v / 100) * chartH;
        doc.line(axisX, gy, axisX + chartW, gy);
        doc.text(String(v), axisX - 14, gy + 2);
      });

      const barW = 26;
      const gap = 18;
      const natX = axisX + chartW / 2 - barW - gap / 2;
      const adaX = axisX + chartW / 2 + gap / 2;
      const natH = (natPct / 100) * chartH;
      const adaH = (adaPct / 100) * chartH;

      doc.setFillColor(TRAIT_META[k].hex);
      doc.rect(natX, baseline - natH, barW, natH, 'F');
      doc.setFillColor('#9a988f');
      doc.rect(adaX, baseline - adaH, barW, adaH, 'F');

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9);
      doc.setTextColor('#1c1d2b');
      doc.text(String(natPct), natX + barW / 2, baseline - natH - 4, { align: 'center' });
      doc.text(String(adaPct), adaX + barW / 2, baseline - adaH - 4, { align: 'center' });

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor('#6b6a75');
      doc.text('Natural', natX + barW / 2, baseline + 12, { align: 'center' });
      doc.text('Adaptive', adaX + barW / 2, baseline + 12, { align: 'center' });

      return { chartTop, chartBottom: baseline + 20, chartRight: axisX + chartW };
    }

    // Two-column bullet layout, used for Strengths vs. Watch-outs.
    function twoColBullets(leftTitle, leftColor, leftItems, rightTitle, rightColor, rightItems) {
      checkPageBreak(30 + Math.max(leftItems.length, rightItems.length) * 26);
      const gutter = 20;
      const colW = (usableW - gutter) / 2;
      const leftX = margin;
      const rightX = margin + colW + gutter;
      const yTop = y;

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.setTextColor(leftColor);
      doc.text(leftTitle, leftX, yTop);
      doc.setTextColor(rightColor);
      doc.text(rightTitle, rightX, yTop);

      function colBullets(items, colX, colWidth, startY) {
        let cy = startY;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9.5);
        doc.setTextColor('#33323d');
        items.forEach(text => {
          const lines = doc.splitTextToSize(text, colWidth - 14);
          doc.text('\u2022', colX, cy);
          lines.forEach((line, i) => {
            doc.text(line, colX + 10, cy);
            cy += 12.5;
          });
          cy += 3;
        });
        return cy;
      }

      const yLeftEnd = colBullets(leftItems, leftX, colW, yTop + 16);
      const yRightEnd = colBullets(rightItems, rightX, colW, yTop + 16);
      y = Math.max(yLeftEnd, yRightEnd) + 6;
    }

    // Dedicated full page for a single trait: numbers, chart, natural-vs-adaptive
    // analysis, insights, mini strengths/watch-outs, and the spectrum gauge.
    function traitPage(k, nat, ada) {
      doc.addPage();
      y = 64;
      doc.setFillColor(TRAIT_META[k].hex);
      doc.rect(margin, y, usableW, 34, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(18);
      doc.setTextColor('#ffffff');
      doc.text(TRAIT_META[k].name, margin + 14, y + 23);
      doc.setFontSize(13);
      doc.text('Natural ' + nat.pcts[k] + '%  /  Adaptive ' + ada.pcts[k] + '%', margin + usableW - 14, y + 23, { align: 'right' });
      y += 50;

      // ---- Top half: general description of this trait ----
      const textX = margin + 160;
      const textW = usableW - 160;
      const chartStartY = y;
      const chartInfo = traitChart(k, nat.pcts[k], ada.pcts[k]);

      let ty = chartStartY;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10.5);
      doc.setTextColor('#33323d');
      const blurbLines = doc.splitTextToSize(TRAIT_META[k].blurb, textW);
      blurbLines.forEach(line => { doc.text(line, textX, ty); ty += 14; });
      ty += 8;

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      REPORT[k].insights.slice(0, 4).forEach(text => {
        const lines = doc.splitTextToSize(text, textW - 14);
        doc.text('\u2022', textX, ty);
        lines.forEach(line => { doc.text(line, textX + 10, ty); ty += 12.5; });
        ty += 2;
      });

      y = Math.max(chartInfo.chartBottom, ty) + 16;
      divider();

      // ---- Second half: dedicated Natural vs. Adaptive analysis ----
      sectionLabel('Natural vs. Adaptive');
      heading('What Changes for You Here \u2014 and What It Means', 13);
      spacer(8);

      const diff = ada.pcts[k] - nat.pcts[k];
      const reason = GAP_REASON[k];
      let leadText, impactList;
      if (Math.abs(diff) <= 4) {
        leadText = 'Your natural and adaptive scores for ' + TRAIT_META[k].name + ' are closely aligned (within ' + Math.abs(diff) + ' pts). ' +
          'That means this trait shows up the same way whether you\'re relaxed or "on" \u2014 you\'re not consciously managing it in professional settings.';
        impactList = reason.alignedImpact;
      } else if (diff > 0) {
        leadText = 'At work, you lead with ' + diff + ' points more ' + TRAIT_META[k].name + ' than feels naturally instinctive. ' +
          'This is common when ' + reason.up;
        impactList = reason.upImpact;
      } else {
        leadText = 'Your natural instinct toward ' + TRAIT_META[k].name + ' runs ' + Math.abs(diff) + ' points higher than how you typically show up at work. ' +
          'This is common when ' + reason.down;
        impactList = reason.downImpact;
      }
      bodyText(leadText, { size: 10 });
      spacer(6);
      bodyText('What this means in practice:', { bold: true, size: 10 });
      spacer(2);
      impactList.forEach(bullet);
      spacer(10);

      twoColBullets(
        'Strengths', '#3f8f6a', REPORT[k].strengths.slice(0, 4),
        'Watch-outs', '#d9483d', REPORT[k].weaknesses.slice(0, 4)
      );
      spacer(14);
      spectrumGauge(k, ada.pcts[k]);
    }

    // Full-page trait spectrum reference: four columns (D/I/S/C), each with an
    // original ordered list of descriptive words from "High" to "Low", plus a
    // marker showing exactly where this person's Adaptive score falls.
    function traitLadderPage(nat, ada) {
      doc.addPage();
      y = 64;
      sectionLabel('Trait Spectrum Reference');
      heading('A Closer Look at the Four Components of Your Behavioral Style', 13);
      spacer(16);

      const SUBMETA = {
        D: { cat: 'Problems:', desc: 'How you tend to approach problems and make decisions' },
        I: { cat: 'People:', desc: 'How you tend to interact with others and share opinions' },
        S: { cat: 'Pace:', desc: 'How you tend to pace things in your environment' },
        C: { cat: 'Procedures:', desc: 'Your preference for established process and standards' },
      };
      const LADDER = {
        D: ['Decisive','Driving','Forceful','Daring','Determined','Competitive','Assertive','Independent','Conservative','Mild','Agreeable','Unassuming'],
        I: ['Gregarious','Persuasive','Inspiring','Enthusiastic','Sociable','Charming','Convincing','Expressive','Reflective','Matter-of-fact','Withdrawn','Reserved'],
        S: ['Patient','Predictable','Steady','Consistent','Supportive','Dependable','Calm','Cooperative','Outgoing','Restless','Active','Spontaneous'],
        C: ['Precise','Systematic','Careful','Analytical','Orderly','Disciplined','Balanced','Flexible','Casual','Improvisational','Unstructured','Impulsive'],
      };

      const traits = ['D','I','S','C'];
      const colW = usableW / 4;
      const x0 = margin;
      const topY = y;
      const headerH = 30;
      const subHeaderH = 50;

      traits.forEach((k, i) => {
        const cx0 = x0 + colW * i;
        doc.setFillColor(TRAIT_META[k].hex);
        doc.rect(cx0, topY, colW, headerH, 'F');
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(12.5);
        doc.setTextColor('#ffffff');
        doc.text(TRAIT_META[k].name, cx0 + colW / 2, topY + headerH / 2 + 4, { align: 'center' });
      });

      const subY = topY + headerH;
      traits.forEach((k, i) => {
        const cx0 = x0 + colW * i;
        doc.setFillColor('#f3f1ea');
        doc.rect(cx0, subY, colW, subHeaderH, 'F');
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(9);
        doc.setTextColor('#4a4952');
        doc.text(SUBMETA[k].cat, cx0 + colW / 2, subY + 14, { align: 'center' });
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(7.2);
        doc.setTextColor('#6b6a75');
        const lines = doc.splitTextToSize(SUBMETA[k].desc, colW - 16);
        let ly = subY + 26;
        lines.forEach(l => { doc.text(l, cx0 + colW / 2, ly, { align: 'center' }); ly += 9; });
      });

      const ladderTop = subY + subHeaderH + 16;
      const ladderH = 320;
      const listTop = ladderTop + 16;
      const listBottom = ladderTop + ladderH - 16;

      traits.forEach((k, i) => {
        const cx0 = x0 + colW * i;
        const cx = cx0 + colW / 2;
        const words = LADDER[k];
        const scoreYNat = listTop + (1 - nat.pcts[k] / 100) * (listBottom - listTop);
        const scoreYAda = listTop + (1 - ada.pcts[k] / 100) * (listBottom - listTop);
        const shadeTop = ladderTop - 12;

        // Soft color fill from the "High" end down to the Natural score,
        // drawn first so the word list stays fully legible on top of it.
        withOpacity(() => {
          doc.setFillColor(...hexToRgb(TRAIT_META[k].hex));
          doc.rect(cx0 + 3, shadeTop, colW - 6, scoreYNat - shadeTop, 'F');
        }, 0.16);

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(9.5);
        doc.setTextColor(TRAIT_META[k].hex);
        doc.text('High ' + k, cx, ladderTop, { align: 'center' });

        const step = (listBottom - listTop) / (words.length - 1);
        words.forEach((w, wi) => {
          const wy = listTop + step * wi;
          doc.setFont('helvetica', (wi === 0 || wi === words.length - 1) ? 'bold' : 'normal');
          doc.setFontSize(8.3);
          doc.setTextColor(wi === 0 ? TRAIT_META[k].hex : (wi === words.length - 1 ? '#9a988f' : '#33323d'));
          doc.text(w, cx, wy, { align: 'center' });
        });

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(9.5);
        doc.setTextColor('#9a988f');
        doc.text('Low ' + k, cx, ladderTop + ladderH, { align: 'center' });

        // Natural: solid line + label on the left
        doc.setDrawColor(TRAIT_META[k].hex);
        doc.setLineWidth(1.3);
        doc.line(cx0 + 6, scoreYNat, cx0 + colW - 6, scoreYNat);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(7.3);
        doc.setTextColor(TRAIT_META[k].hex);
        doc.text('N ' + nat.pcts[k] + '%', cx0 + 8, scoreYNat - 4, { align: 'left' });

        // Adaptive: dashed line + label on the right
        doc.setDrawColor(120, 90, 40);
        doc.setLineWidth(1.3);
        try { doc.setLineDashPattern([3, 2], 0); } catch (e) {}
        doc.line(cx0 + 6, scoreYAda, cx0 + colW - 6, scoreYAda);
        try { doc.setLineDashPattern([], 0); } catch (e) {}
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(7.3);
        doc.setTextColor(120, 90, 40);
        doc.text('A ' + ada.pcts[k] + '%', cx0 + colW - 8, scoreYAda - 4, { align: 'right' });
      });

      doc.setDrawColor('#1c1d2b');
      doc.setLineWidth(1);
      doc.rect(x0, topY, usableW, (ladderTop + ladderH) - topY);
      for (let i = 1; i < 4; i++) {
        doc.line(x0 + colW * i, topY, x0 + colW * i, ladderTop + ladderH);
      }

      y = ladderTop + ladderH + 20;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8.5);
      doc.setTextColor('#1c1d2b');
      doc.text('N', margin, y);
      doc.setDrawColor('#9a988f');
      doc.setLineWidth(1.3);
      doc.line(margin + 12, y - 3, margin + 30, y - 3);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8.5);
      doc.setTextColor('#6b6a75');
      doc.text('= Natural (shaded fill + solid line)', margin + 36, y);

      doc.setFont('helvetica', 'bold');
      doc.setTextColor('#1c1d2b');
      doc.text('A', margin + 230, y);
      try { doc.setLineDashPattern([3, 2], 0); } catch (e) {}
      doc.line(margin + 242, y - 3, margin + 260, y - 3);
      try { doc.setLineDashPattern([], 0); } catch (e) {}
      doc.setFont('helvetica', 'normal');
      doc.setTextColor('#6b6a75');
      doc.text('= Adaptive (dashed line)', margin + 266, y);
      y += 16;

      doc.setFont('helvetica', 'italic');
      doc.setFontSize(8.5);
      doc.setTextColor('#6b6a75');
      doc.text('Shading runs from the High end down to your Natural score. The dashed line marks your Adaptive (at-work) score on the same spectrum.', margin, y, { maxWidth: usableW });
    }


    doc.setTextColor('#f6f4ef');
    doc.text('DISC Behavioral Style Report', margin, 31);
    y = 84;

    const natTop = nat.ranked[0], natSecond = nat.ranked[1];
    const adaTop = ada.ranked[0], adaSecond = ada.ranked[1];
    const dateStr = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    if (reportName) {
      bodyText('Prepared for ' + reportName + ' \u2014 ' + dateStr, { size: 10, color: '#6b6a75' });
    } else {
      bodyText('Prepared ' + dateStr, { size: 10, color: '#6b6a75' });
    }
    spacer(10);

    sectionLabel('Overview');
    heading('Your Behavioral Style, At a Glance', 15);
    spacer(6);
    bodyText('Your Natural style is your baseline tendency \u2014 how you operate before adjusting to a role or situation. Your Adaptive style is what you lead with day to day, adjusted for what the job demands. This report analyzes both throughout: each section looks at how your instinctive baseline compares to how you actually show up at work.', { size: 10 });
    spacer(10);
    bodyText('Your natural style leans ' + TRAIT_META[natTop].name + (nat.gapClose ? '/' + TRAIT_META[natSecond].name : '') +
      '. Your adaptive, at-work style leans ' + TRAIT_META[adaTop].name + (ada.gapClose ? '/' + TRAIT_META[adaSecond].name : '') + '.', { bold: true, size: 11 });
    spacer(14);

    // Executive Summary chart, diamonds, and Natural/Adaptive explanation — same page
    executiveSummaryPage(nat, ada);

    // Dedicated full page: quadrant map with both Natural and Adaptive shapes
    quadrantChartFullPage(nat.pcts, ada.pcts);

    // Dedicated full page: trait spectrum reference (word ladder + score markers)
    traitLadderPage(nat, ada);

    // Dedicated page per trait
    ['D','I','S','C'].forEach(k => traitPage(k, nat, ada));

    doc.addPage();
    y = 64;
    sectionLabel('Ideas for Being More Effective');
    heading('What helps you do your best work', 14);
    spacer(8);
    bodyText('Based on your adaptive style, you tend to be more effective with:', { size: 10, color: '#6b6a75' });
    spacer(6);
    REPORT[adaTop].effective.forEach(bullet);
    if (ada.gapClose) REPORT[adaSecond].effective.slice(0, 2).forEach(bullet);
    spacer(16);
    divider();

    checkPageBreak(140);
    sectionLabel('Strengths & Watch-outs');
    heading('Your behavioral breakdown', 14);
    spacer(10);
    const strengthsList = REPORT[adaTop].strengths.concat(ada.gapClose ? REPORT[adaSecond].strengths.slice(0, 2) : []);
    const weaknessesList = REPORT[adaTop].weaknesses.concat(ada.gapClose ? REPORT[adaSecond].weaknesses.slice(0, 2) : []);
    twoColBullets('Strengths', '#3f8f6a', strengthsList, 'Watch-outs', '#d9483d', weaknessesList);
    spacer(16);
    divider();

    checkPageBreak(100);
    sectionLabel('Communication Insights for Others');
    heading('How others can communicate with ' + (reportName || 'you') + ' effectively', 13);
    spacer(8);
    bodyText('Things to do:', { bold: true, size: 10.5 });
    spacer(2);
    REPORT[adaTop].doThis.forEach(bullet);
    spacer(6);
    bodyText('Things to avoid:', { bold: true, size: 10.5 });
    spacer(2);
    REPORT[adaTop].dontThis.forEach(bullet);
    spacer(16);
    divider();

    checkPageBreak(60);
    sectionLabel('Natural vs. Adaptive Gap');
    spacer(4);
    const up = gaps.slice().sort((a,b) => b.diff - a.diff)[0];
    const down = gaps.slice().sort((a,b) => a.diff - b.diff)[0];
    bodyText('On average, your scores shift about ' + Math.round(overallShift) + ' points per trait between your natural baseline and your adaptive/work style. At work, you dial UP ' +
      TRAIT_META[up.k].name + ' (' + (up.diff >= 0 ? '+' : '') + up.diff + ' pts) and dial DOWN ' + TRAIT_META[down.k].name + ' (' + (down.diff >= 0 ? '+' : '') + down.diff + ' pts).');
    spacer(6);
    bodyText(overallShift >= 10
      ? "That's a fairly large adaptation. It's often effective \u2014 you're consciously adjusting to what the role needs \u2014 but a sustained, large gap over long periods can lead to fatigue or burnout. Worth building in recovery time outside of work."
      : "That's a relatively modest adaptation. Your workplace behavior is close to your natural baseline, which is usually easier to sustain day to day.");
    spacer(16);
    divider();

    checkPageBreak(70);
    sectionLabel('Sales Role Application');
    heading('How this plays out in a sales role', 14);
    spacer(8);
    REPORT[adaTop].sales.forEach(bullet);
    if (ada.gapClose) {
      spacer(6);
      bodyText('Where your ' + TRAIT_META[adaSecond].name + ' side adds to this:', { bold: true, size: 10.5 });
      spacer(2);
      REPORT[adaSecond].sales.slice(0, 2).forEach(bullet);
    }
    if (natTop !== adaTop) {
      spacer(8);
      bodyText('Note: your natural baseline leans ' + TRAIT_META[natTop].name + ', but your adaptive/work style leans ' + TRAIT_META[adaTop].name + '. That means you\'re consciously flexing into a different mode for the job \u2014 effective, but worth monitoring for energy drain over a long day of client-facing work.', { size: 10, color: '#6b6a75' });
    }

    spacer(20);
    checkPageBreak(40);
    doc.setFont('helvetica', 'italic');
    doc.setFontSize(9);
    doc.setTextColor('#6b6a75');
    doc.text('This report is an original, self-administered assessment inspired by general DISC behavioral theory. It is intended to support self-awareness and coaching conversations, not as a clinical, hiring, or licensed psychometric instrument.', margin, y, { maxWidth: usableW });

    doc.save('disc-style-report' + (reportName ? '-' + reportName.replace(/\s+/g, '-').toLowerCase() : '') + '.pdf');
  }

  // If this page was opened via a results link, jump straight to those results
  // instead of starting a fresh assessment.
  const urlParams = new URLSearchParams(window.location.search);
  const sharedR = urlParams.get('r');
  const sharedData = sharedR ? decodeResultsPayload(sharedR) : null;

  if (sharedData) {
    reportName = sharedData.nm || '';
    displayResults(rankOf(sharedData.n), rankOf(sharedData.a), { justFinished: false });
  } else {
    renderIntro();
  }
})();
</script>
